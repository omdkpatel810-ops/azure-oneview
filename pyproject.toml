[project]
name = "azure-oneview"
version = "0.1.0"
description = "Branch and other-cloud servers managed from Azure with Azure Arc."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["onboarding", "oneview"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["onboarding", "oneview"]
